<style>
  /* Palette and shapes from the Android app (MD/app/src/main/res: colors.xml, drawable/*.xml). */
  :root {
    --green: #42A186; --green-dark: #2E7D67; --green-soft: #A6CF98; --grad-a: #2EB086; --grad-b: #59CE8F;
    --red: #DF2E38; --red-soft: #fde8e9; --down-soft: #e3f4ec; --stroke: #B9B4C7;
    --bg: #ffffff; --card: #FCFCFC; --field: #F0F0F0; --text: #1d2420; --muted: #5f6b66; --line: #e6ebe8;
    --on-green: #ffffff; --shadow: 0 8px 24px rgba(30, 80, 60, .14);
  }
  @media (prefers-color-scheme: dark) {
    :root { --green: #4fc4a2; --green-dark: #8fe0c6; --red: #ff7b82; --red-soft: #3a1d20; --down-soft: #163328;
      --bg: #0f1513; --card: #18201d; --field: #222c28; --text: #e6efea; --muted: #9db0a8; --line: #2a3531;
      --on-green: #0b1410; --shadow: 0 8px 24px rgba(0, 0, 0, .45); }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.55 "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  h1, h2, h3, .big, button, .stat b { font-family: Poppins, "Plus Jakarta Sans", system-ui, sans-serif; }

  .hero { background: linear-gradient(160deg, var(--grad-a), #42A186 60%, var(--green-soft)); padding: 22px 16px 86px; color: #fff; }
  .hero-in { max-width: 760px; margin: 0 auto; display: flex; align-items: center; justify-content: center; gap: 10px; position: relative; }
  .lang { position: absolute; right: 0; padding: .35rem .8rem; font-size: .85rem; border-radius: 100px;
    background: rgba(255, 255, 255, .18); color: #fff; border: 2px solid rgba(255, 255, 255, .7); }
  .logo { width: 44px; height: 44px; border-radius: 12px; background: #fff; display: grid; place-items: center; }
  .logo img { width: 30px; height: 30px; }
  .hero h1 { margin: 0; font-size: 1.7rem; font-style: italic; font-weight: 700; letter-spacing: -.01em; }

  main { max-width: 760px; margin: -66px auto 0; padding: 0 16px 48px; }
  .card { background: var(--card); border-radius: 20px; padding: 22px; margin-top: 20px; box-shadow: var(--shadow); }
  .greet { text-align: center; border-radius: 8px; padding: 18px 16px; margin-top: 0; }
  .greet h2 { margin: 0; color: var(--green); font-family: "Plus Jakarta Sans", sans-serif; font-weight: 700; font-size: 1.45rem; }
  .greet p { margin: .3rem 0 0; color: var(--muted); }
  .step { font-size: .75rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--green); }
  h2.title { margin: .15rem 0 1rem; font-size: 1.35rem; font-weight: 600; }

  label { display: block; font-size: .92rem; margin-bottom: .3rem; color: var(--text); }
  .hint { color: var(--muted); font-size: .82rem; }
  input, select { width: 100%; font: 16px "Plus Jakarta Sans", system-ui, sans-serif; color: var(--text); background: var(--field);
    border: 2px solid transparent; border-radius: 12px; padding: .8rem .9rem; }
  input:focus, select:focus { outline: none; border-color: var(--green); }
  button:focus-visible, .cat:focus-visible { outline: 3px solid var(--green); outline-offset: 2px; }
  .row { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: end; }
  .row > div, .grid > div { min-width: 0; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 560px) { .grid { grid-template-columns: 1fr; } }
  button { font-size: 1rem; font-weight: 700; border: 0; border-radius: 10px; padding: .8rem 1.4rem; background: var(--green); color: var(--on-green); cursor: pointer; }
  button.wide { width: 100%; margin-top: 18px; }
  button:hover { filter: brightness(1.05); }

  .cats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 18px; }
  @media (max-width: 560px) { .cats { grid-template-columns: repeat(2, 1fr); } }
  .cat { font: inherit; text-align: left; color: var(--text); background: var(--bg); border: 2px solid var(--line); border-radius: 20px;
    padding: 10px; cursor: pointer; display: flex; flex-direction: column; gap: 2px; font-weight: 400; }
  .cat img { width: 100%; aspect-ratio: 1; object-fit: contain; border-radius: 14px; background: #fff; }
  .cat b { font-family: Poppins, sans-serif; font-weight: 500; font-size: .95rem; margin-top: 4px; }
  .cat span { font-size: .75rem; color: var(--muted); line-height: 1.35; }
  .cat[aria-pressed="true"] { border-color: var(--green); background: var(--down-soft); }

  .result { margin-top: 20px; }
  .headline { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; }
  .big { font-size: 3rem; font-weight: 700; letter-spacing: -.03em; line-height: 1; color: var(--green-dark); }
  .chip { display: inline-block; padding: .25rem .7rem; border-radius: 100px; font-size: .85rem; font-weight: 600; border: 2px solid currentColor; }
  .chip.up { color: var(--red); background: var(--red-soft); } .chip.down { color: var(--green); background: var(--down-soft); }
  .chip.unchanged { color: var(--muted); background: var(--field); }
  .muted { color: var(--muted); font-size: .9rem; }
  .err { color: var(--red); font-weight: 600; }
  svg { width: 100%; height: auto; display: block; margin-top: 14px; }
  svg text { fill: var(--muted); font-size: 11px; font-family: "Plus Jakarta Sans", sans-serif; }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: .82rem; color: var(--muted); }
  .legend i { display: inline-block; width: 14px; height: 3px; vertical-align: middle; margin-right: 5px; background: var(--text); }
  .legend i.f { background: var(--green); } .legend i.b { height: 10px; background: var(--down-soft); }

  .res-title { text-align: center; font-size: 1.4rem; font-weight: 500; margin: 26px 0 12px; }
  .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .stat { border-radius: 14px; padding: 14px; background: var(--field); }
  .stat div { color: var(--green); font-size: .88rem; font-weight: 600; } .stat b { font-size: 1.2rem; font-weight: 600; }
  .stat.hl { background: linear-gradient(135deg, var(--grad-a), var(--grad-b)); color: #fff; }
  .stat.hl div { color: rgba(255, 255, 255, .9); }
  .callout { margin-top: 14px; padding: 14px; border-radius: 14px; border: 2px dashed var(--green-soft); }
  .trust { margin-top: 16px; font-size: .85rem; color: var(--muted); border-top: 1px solid var(--line); padding-top: 12px; }
  footer { margin-top: 28px; font-size: .82rem; color: var(--muted); text-align: center; }
  footer a { color: var(--green); }
</style>

// JS twin of src/financial.py so the static site needs no server; tests/test_planner_js.py keeps them in sync.
function plan(currentSavings, monthlyIncome, monthlyExpenses, goalAmount, annualInflationPct) {
  const fail = (code, message) => { const e = new Error(message); e.code = code; throw e; };
  const values = {current_savings: currentSavings, monthly_income: monthlyIncome, monthly_expenses: monthlyExpenses,
    goal_amount: goalAmount, annual_inflation_pct: annualInflationPct};
  for (const [k, v] of Object.entries(values)) {
    if (typeof v !== "number" || !Number.isFinite(v)) fail("invalid_input", `${k} must be a finite number`);
    if (v < 0 && k !== "annual_inflation_pct") fail("negative_input", `${k} must not be negative`);
  }
  if (goalAmount <= 0) fail("invalid_goal", "goal_amount must be greater than 0");
  if (!(annualInflationPct > -50 && annualInflationPct < 100)) fail("invalid_input", "annual_inflation_pct must be between -50 and 100");
  const monthlySaving = monthlyIncome - monthlyExpenses;
  if (monthlySaving <= 0 && currentSavings < goalAmount) fail("no_saving_capacity", "monthly_expenses must be lower than monthly_income");

  const r = annualInflationPct / 100;
  for (let n = 0; n <= 1200; n++) {
    const adjustedGoal = goalAmount * (1 + r) ** (n / 12);
    if (currentSavings + monthlySaving * n >= adjustedGoal) {
      return {goal_today: Math.round(goalAmount), inflation_adjusted_goal: Math.round(adjustedGoal),
        monthly_saving_capacity: Math.round(monthlySaving), months_to_goal: n,
        time_to_goal: {years: Math.floor(n / 12), months: n % 12}, annual_inflation_assumption_pct: annualInflationPct,
        note: "Planning estimate, not financial advice. Assumes constant income, expenses and inflation, and no investment return."};
    }
  }
  fail("goal_unreachable", "goal is not reachable within 100 years under this inflation assumption");
}
if (typeof module !== "undefined") module.exports = { plan };
</script>

const dec = (n) => n.toLocaleString(LOCALE[lang], {minimumFractionDigits: 2, maximumFractionDigits: 2});

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const cityLabel = () => esc($("city").selectedOptions[0].text);

function chart(f) {
  const hist = f.history.filter((h) => h.inflation !== null);
  const pts = hist.map((h) => h.inflation), fc = f.predicted_inflation;
  const all = [...pts, fc - MAE, fc + MAE, 0];
  const lo = Math.floor(Math.min(...all) * 2) / 2, hi = Math.ceil(Math.max(...all) * 2) / 2;
  const W = 680, H = 240, L = 40, R = 16, T = 12, B = 28, n = pts.length + 1;
  const x = (i) => L + i * (W - L - R) / (n - 1), y = (v) => T + (hi - v) * (H - T - B) / ((hi - lo) || 1);
  let g = "";
  for (let v = lo; v <= hi + 1e-9; v += 0.5) {
    g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" ${v === 0 ? 'stroke-width="1.5"' : ""}/>`;
    g += `<text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${v.toLocaleString(LOCALE[lang], {minimumFractionDigits: 1})}</text>`;
  }
  hist.forEach((h, i) => { if ((hist.length - 1 - i) % 6 === 3) g += `<text x="${x(i)}" y="${H - 8}" text-anchor="middle">${monthName(h.period)}</text>`; });
  const line = pts.map((v, i) => `${x(i)},${y(v)}`).join(" ");
  const xf = x(n - 1), xl = x(n - 2);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${t("chart_aria", {n: pts.length, month: monthName(f.forecast_period)})}">
    ${g}
    <rect x="${xf - 9}" y="${y(fc + MAE)}" width="18" height="${y(fc - MAE) - y(fc + MAE)}" rx="4" fill="var(--down-soft)"/>
    <polyline points="${line}" fill="none" stroke="var(--text)" stroke-width="2" stroke-linejoin="round"/>
    <line x1="${xl}" y1="${y(pts[pts.length - 1])}" x2="${xf}" y2="${y(fc)}" stroke="var(--green)" stroke-width="2" stroke-dasharray="5 4"/>
    <circle cx="${xf}" cy="${y(fc)}" r="5" fill="var(--green)"/>
    <text x="${xf + 6}" y="${H - 8}" text-anchor="end" style="fill:var(--green);font-weight:600">${monthName(f.forecast_period)}</text>
  </svg>
  <div class="legend"><span><i></i>${t("legend_actual")}</span><span><i class="f"></i>${t("legend_fc")}</span><span><i class="b"></i>${t("legend_band", {mae: dec(MAE)})}</span></div>`;
}

function syncUrl() {
  const q = new URLSearchParams(location.search);
  q.set("lang", lang);
  if (!$("planner").hidden) q.set("city", $("city").value);
  history.replaceState(null, "", "?" + q);
}

$("f-plan").onsubmit = (e) => {
  e.preventDefault();

  const body = {};
  for (const k of ["current_savings", "monthly_income", "monthly_expenses", "goal_amount"]) body[k] = num(k);
  const custom = $("annual_inflation").value.trim().replace(",", ".");
  try {
    const p = plan(body.current_savings, body.monthly_income, body.monthly_expenses, body.goal_amount,
                   custom ? Number(custom) : f.annual_inflation_12m);
    const source = custom ? t("source_custom") : t("source_city", {city: cityLabel(), month: monthName(f.as_of)});
    const tg = p.time_to_goal, s = p.monthly_saving_capacity;
    const noInfl = Math.max(0, Math.ceil((p.goal_today - body.current_savings) / s));
    const extra = p.months_to_goal - noInfl;
    const dur = [tg.years && t("years", {n: tg.years}), tg.months && t("months", {n: tg.months})].filter(Boolean).join(" ") || t("now");
    $("plan").innerHTML = `

      <div class="stats">

};

  for (const el of document.querySelectorAll("[data-i18n]")) el.innerHTML = t(el.dataset.i18n);
  for (const el of document.querySelectorAll("[data-i18n-aria]")) el.setAttribute("aria-label", t(el.dataset.i18nAria));
  $("trust").innerHTML = t("trust", {model: esc(MODEL), food: USES_FOOD ? t("trust_food") : "", mae: dec(MAE),
                                     naive: dec(NAIVE_MAE), start: TEST[0], end: TEST[1]});
  $("lang").textContent = t("switch_to");
  // re-render whatever result is on screen in the new language
  if (!$("planner").hidden) $("f-forecast").requestSubmit();
  if ($("plan").innerHTML) $("f-plan").requestSubmit();
}

$("lang").onclick = () => {
  lang = lang === "id" ? "en" : "id";
  try { localStorage.setItem("lang", lang); } catch {}
  applyLang();
  syncUrl();
};

applyLang();
const shared = params.get("city");
if (shared && [...$("city").options].some((o) => o.value === shared.toUpperCase())) {
  $("city").value = shared.toUpperCase();
  $("f-forecast").requestSubmit();
}
</script>
</body>
</html>
